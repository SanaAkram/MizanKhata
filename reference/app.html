<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#22331F">
<title>MizanKhata — Day, Work &amp; Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #EEEBE3; --paper: #FBF9F4; --ink: #22271F; --ink-soft: #5B6156;
    --forest: #2F4A34; --forest-deep: #1C2E20; --gold: #B8892B; --line: #DCD6C7;
    --danger: #8C3B2E; --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{ background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display:flex; justify-content:center; }
  #app{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; background: var(--bg); padding-bottom: 84px; position:relative; }
  header{ padding: 28px 22px 14px; }
  .day-label{ font-size:13px; letter-spacing:0.02em; color: var(--ink-soft); }
  h1{ font-family:'Source Serif 4', serif; font-weight:600; font-size:28px; margin: 2px 0 0; color: var(--forest-deep); }
  main{ padding: 6px 18px 18px; flex:1; }
  .card{ background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }

  .timer-card{ text-align:center; padding: 32px 20px; }
  .elapsed{ font-family:'Source Serif 4', serif; font-size: 46px; font-weight:600; color: var(--forest-deep); margin: 4px 0 22px; font-variant-numeric: tabular-nums; }
  .timer-hint{ color: var(--ink-soft); font-size: 14px; margin-bottom: 6px;}
  .btn-round{ width: 128px; height: 128px; border-radius: 50%; border: none; font-size: 17px; font-weight:600; color: #fff; background: var(--forest); cursor:pointer; transition: transform .12s ease; }
  .btn-round:active{ transform: scale(0.95); }
  .btn-round.running{ background: var(--danger); }

  .today-total{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 4px; }
  .today-total .label{ font-size:14px; color:var(--ink-soft); }
  .today-total .value{ font-family:'Source Serif 4', serif; font-size:22px; font-weight:600; color:var(--forest-deep); }

  .session{ display:flex; justify-content:space-between; gap:12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .session:first-of-type{ border-top:none; }
  .session .meta{ font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .session .dur{ font-weight:600; white-space:nowrap; }
  .session .note{ font-size:14px; margin-top:3px; color:var(--ink); }
  .empty-note{ color: var(--ink-soft); font-size:14px; text-align:center; padding:8px 0 4px;}

  .section-title{ font-family:'Source Serif 4', serif; font-size:16px; font-weight:600; color: var(--forest-deep); margin: 18px 4px 8px; }
  .section-title:first-child{ margin-top:2px; }
  .routine-item{ display:flex; align-items:center; gap:12px; background: var(--paper); border:1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 8px; }
  .routine-item.done{ opacity: 0.5; }
  .check{ width: 24px; height:24px; border-radius:50%; border: 2px solid var(--forest); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .check.checked{ background: var(--forest); }
  .check.checked::after{ content:'✓'; color:#fff; font-size:14px; }
  .routine-text{ flex:1; }
  .routine-text .name{ font-size:15px; font-weight:500; }
  .routine-text .time{ font-size:13px; color: var(--ink-soft); }
  .routine-item.done .name{ text-decoration: line-through; }

  .product-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
  .product-row:first-child{ border-top:none; }
  .product-row .pname{ font-size:15px; }
  .product-row .psub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .product-row .pqty{ font-family:'Source Serif 4', serif; font-weight:600; color:var(--forest-deep); font-size:17px; text-align:right; }

  .product-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
  .product-btn{ background: var(--bg); border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:left; cursor:pointer; }
  .product-btn:disabled{ cursor:not-allowed; }
  .product-btn .pname{ font-weight:600; font-size:14px; }
  .product-btn .pprice{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .cart-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .cart-row:first-child{ border-top:none; }
  .qty-controls{ display:flex; align-items:center; gap:10px; }
  .qty-btn{ width:26px;height:26px;border-radius:50%;border:1px solid var(--forest); background:none; color:var(--forest); font-size:16px; cursor:pointer; display:flex;align-items:center;justify-content:center; }
  .cart-total-row{ display:flex;justify-content:space-between; padding-top:12px; margin-top:6px; border-top:2px solid var(--line); font-weight:600; }
  .btn-complete{ width:100%; margin-top:14px; padding:14px; border:none; border-radius:12px; background:var(--forest); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  .gear-btn{ background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft); }
  .bill-card{ border-top:1px solid var(--line); padding:12px 0; }
  .bill-card:first-child{ border-top:none; }
  .bill-items{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .bill-head{ display:flex;justify-content:space-between; }
  .bill-actions{ display:flex; gap:8px; margin-top:8px; }
  .icon-btn{ background:none;border:1px solid var(--line); border-radius:10px; width:36px;height:34px; font-size:15px; cursor:pointer; display:flex;align-items:center;justify-content:center; color:var(--ink-soft); }
  .product-row-manage{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .product-row-manage:first-child{ border-top:none; }
  .manage-actions button{ background:none;border:none;color:var(--danger); font-size:13px; cursor:pointer; text-decoration:underline; }

  .stock-card{ border-top:1px solid var(--line); padding:12px 0; }
  .stock-card:first-child{ border-top:none; }
  .stock-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .stock-head .pname{ font-weight:600; font-size:15px; }
  .stock-head .qty{ font-family:'Source Serif 4', serif; font-weight:600; color:var(--forest-deep); font-size:18px; }
  .stock-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap; }
  .purchase-log-row{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:13px; }
  .purchase-log-row:first-child{ border-top:none; }
  .tag-low{ background:#F6E4E0; color:var(--danger); font-size:11px; padding:2px 8px; border-radius:8px; margin-left:8px; }
  .form-label{ font-size:12px; color:var(--ink-soft); margin:0 0 4px 2px; display:block; }
  .toggle-btn{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans'; font-size:13px; cursor:pointer; }
  .toggle-btn.active{ background:var(--forest); color:#fff; border-color:var(--forest); }
  .select-field, .sheet input[type=text], .sheet input[type=number]{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px; font-family:'IBM Plex Sans'; font-size:14px; margin-bottom:12px; background:#fff; }
  .receipt-preview{ width:100%; border-radius:12px; border:1px solid var(--line); margin-bottom:14px; display:block; }

  .subtab-row{ display:flex; gap:8px; margin-bottom:14px; }
  .subtab-btn{ flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); font-family:'IBM Plex Sans'; font-size:13px; font-weight:600; cursor:pointer; }
  .subtab-btn.active{ background:var(--forest-deep); color:#fff; border-color:var(--forest-deep); }
  .customer-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--line); cursor:pointer; }
  .customer-row:first-child{ border-top:none; }
  .customer-row .cname{ font-size:15px; font-weight:600; }
  .customer-row .cphone{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .customer-row .cbal{ font-family:'Source Serif 4', serif; font-weight:600; font-size:16px; text-align:right; }
  .cbal.owe{ color: var(--danger); }
  .cbal.clear{ color: var(--ink-soft); font-weight:400; font-size:13px; }
  .cash-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-top:1px solid var(--line); font-size:14px; }
  .cash-row:first-child{ border-top:none; }
  .cash-row .cnote{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .camt.in{ color: var(--forest-deep); font-weight:600; }
  .camt.out{ color: var(--danger); font-weight:600; }
  .btn-whatsapp{ background:#25D366; color:#fff; text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .tx-row{ display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .tx-row:first-child{ border-top:none; }
  .pay-badge{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px; margin-top:5px; }
  .pay-badge.cash{ background:#E3ECE4; color:var(--forest-deep); }
  .pay-badge.credit{ background:#F6E4E0; color:var(--danger); }
  .pay-badge.partial{ background:#FBF3DD; color:#6B4E12; }
  .calc-row-wrap{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .calc-row-wrap input{ margin-bottom:0 !important; flex:1; }
  .calc-toggle{ background:var(--bg); border:1px solid var(--line); border-radius:8px; width:38px; height:38px; font-size:16px; cursor:pointer; color:var(--ink-soft); flex-shrink:0; }
  .calc-pad{ display:none; grid-template-columns: repeat(4,1fr); gap:7px; margin-bottom:12px; }
  .calc-pad.open{ display:grid; }
  .calc-key{ padding:11px 0; border-radius:9px; border:1px solid var(--line); background:var(--paper); font-family:'IBM Plex Sans'; font-size:15px; cursor:pointer; text-align:center; color:var(--ink); }
  .calc-key.op{ background:var(--bg); color:var(--forest-deep); font-weight:600; }
  .calc-key.eq{ background:var(--forest); color:#fff; font-weight:600; }
  .calc-key.ac{ background:#F6E4E0; color:var(--danger); font-weight:600; }
  .calc-key.wide{ grid-column: span 2; }

  .fab-wrap{ position:fixed; bottom:78px; left:0; right:0; display:flex; justify-content:center; pointer-events:none; z-index:15; }
  .fab-inner{ width:100%; max-width:480px; display:flex; justify-content:flex-end; padding-right:20px; }
  .fab{ pointer-events:auto; width:58px;height:58px;border-radius:50%; background:var(--forest); color:#fff; border:none; font-size:28px; line-height:1; box-shadow:0 6px 16px rgba(28,46,32,.35); cursor:pointer; }

  nav{ position: fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; background: var(--forest-deep); padding-bottom: env(safe-area-inset-bottom); }
  .nav-inner{ width:100%; max-width:480px; display:flex; }
  .nav-btn{ flex:1; background:none; border:none; color: rgba(255,255,255,0.55); font-size:12.5px; padding: 14px 0 12px; cursor:pointer; }
  .nav-btn.active{ color: var(--gold); font-weight:600; }
  .nav-btn .dot{ display:block; width:6px; height:6px; border-radius:50%; background:transparent; margin:0 auto 5px; }
  .nav-btn.active .dot{ background: var(--gold); }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(28,46,32,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet{ width:100%; max-width:480px; background: var(--paper); border-radius: 22px 22px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y:auto; }
  .sheet h2{ font-family:'Source Serif 4', serif; font-size:19px; margin:0 0 4px; color:var(--forest-deep);}
  .sheet p{ font-size:13px; color:var(--ink-soft); margin:0 0 14px;}
  .sheet textarea{ width:100%; min-height:80px; border:1px solid var(--line); border-radius:12px; padding:12px; font-family:'IBM Plex Sans'; font-size:15px; resize:none; margin-bottom:14px; }
  .sheet-actions{ display:flex; gap:10px; }
  .sheet-actions button{ flex:1; padding:13px; border-radius:12px; border:none; font-family:'IBM Plex Sans'; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-save{ background: var(--forest); color:#fff; }
  .btn-skip{ background: var(--line); color: var(--ink); }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); background: var(--forest-deep); color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; z-index:30; opacity:0; transition:opacity .3s ease; max-width: 90%; text-align:center; }
  .toast.show{ opacity:1; }
  .banner{ background: #FBF3DD; border:1px solid var(--gold); color: #6B4E12; border-radius:14px; padding:12px 14px; font-size:13px; margin-bottom:14px; display:none; }

  #authScreen{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 24px; background:var(--bg); }
  #authScreen h1{ text-align:center; margin-bottom:4px; }
  #authScreen .auth-sub{ text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:28px; }
  #authScreen input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:13px; font-family:'IBM Plex Sans'; font-size:15px; margin-bottom:12px; background:#fff; }
  #authScreen .btn-save{ width:100%; padding:14px; }
  #authScreen .auth-toggle{ text-align:center; margin-top:16px; font-size:13.5px; color:var(--ink-soft); }
  #authScreen .auth-toggle a{ color:var(--forest-deep); font-weight:600; text-decoration:underline; cursor:pointer; }
  #authScreen .auth-error{ color:var(--danger); font-size:13px; margin:-4px 0 12px; display:none; }
  #signOutBtn{ background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; }
</style>
</head>

<script>
const SUPABASE_URL = "https://fksdpsecfnaibquymiir.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrc2Rwc2VjZm5haWJxdXltaWlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MjY1MDMsImV4cCI6MjEwNDUwMjUwM30.dny1Fpf0XdLYqZcFUxAvvFD9I53MlFY6nSQCA3tw-1o";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let authMode = "signin";

function showAuthScreen(){
  document.getElementById("authScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function showApp(){
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("app").style.display = "flex";
}
function setAuthError(msg){
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}
document.getElementById("authToggleWrap").addEventListener("click", (e)=>{
  if(e.target.tagName !== "A") return;
  authMode = authMode === "signin" ? "signup" : "signin";
  document.getElementById("authSubmitBtn").textContent = authMode === "signin" ? "Sign in" : "Create account";
  document.getElementById("authToggleWrap").innerHTML = authMode === "signin"
    ? 'New here? <a>Create an account</a>'
    : 'Already have an account? <a>Sign in</a>';
  setAuthError("");
});
document.getElementById("authSubmitBtn").addEventListener("click", async ()=>{
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  if(!email || !password){ setAuthError("Enter both email and password"); return; }
  setAuthError("");
  const btn = document.getElementById("authSubmitBtn");
  btn.textContent = "Please wait...";
  try{
    if(authMode === "signin"){
      const {error} = await sb.auth.signInWithPassword({email, password});
      if(error){ setAuthError(error.message); btn.textContent = "Sign in"; return; }
    } else {
      const {error} = await sb.auth.signUp({email, password});
      if(error){ setAuthError(error.message); btn.textContent = "Create account"; return; }
    }
    await startApp();
  }catch(e){
    setAuthError("Something went wrong — try again");
    btn.textContent = authMode === "signin" ? "Sign in" : "Create account";
  }
});
document.getElementById("signOutBtn").addEventListener("click", async ()=>{
  await sb.auth.signOut();
  showAuthScreen();
});

const UNIT_LABELS = {pcs:'pieces', kg:'kg', g:'grams', litre:'litres', dozen:'dozens', box:'boxes'};

function todayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtClock(ms){
  const s = Math.floor(ms/1000);
  const h = String(Math.floor(s/3600)).padStart(2,"0");
  const m = String(Math.floor((s%3600)/60)).padStart(2,"0");
  const sec = String(s%60).padStart(2,"0");
  return h+":"+m+":"+sec;
}
function fmtHM(ms){
  const mins = Math.round(ms/60000);
  return Math.floor(mins/60)+"h "+(mins%60)+"m";
}
function fmtTimeLabel(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function formatQty(qty, unit){
  const q = Number(qty) || 0;
  const qtyStr = Number.isInteger(q) ? q.toString() : q.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
  return `${qtyStr} ${unit || 'pcs'}`;
}
function unitStep(unit){
  return (unit === 'kg' || unit === 'litre' || unit === 'g') ? 0.5 : 1;
}
async function localGet(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function localSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error("save failed", e); showToast("Couldn't save — try again"); }
}

async function sbFetchSalesForDate(dateKey){
  const {data, error} = await sb.from("shop_sales").select("*, shop_sale_items(*)").gte("time", dateKey+"T00:00:00").lte("time", dateKey+"T23:59:59.999").order("time");
  if(error){ console.error(error); showToast("Couldn't load sales"); return []; }
  return data.map(r=>({
    id:r.id, time:r.time, total:Number(r.total), paidCash:Number(r.paid_cash), creditAmount:Number(r.credit_amount),
    customerId:r.customer_id, customerName:r.customer_name, hasPaperPhoto:r.has_paper_photo,
    items:(r.shop_sale_items||[]).map(i=>({productId:i.product_id, name:i.name, unit:i.unit, price:Number(i.price), qty:Number(i.qty)}))
  }));
}
async function sbSyncSalesForDate(arr){
  if(!arr.length) return;
  const {error} = await sb.from("shop_sales").upsert(arr.map(s=>({
    id:s.id, time:s.time, total:s.total, paid_cash:s.paidCash, credit_amount:s.creditAmount,
    customer_id:s.customerId||null, customer_name:s.customerName||null, has_paper_photo:!!s.hasPaperPhoto
  })));
  if(error){ console.error(error); showToast("Couldn't save sale"); return; }
  for(const s of arr){
    await sb.from("shop_sale_items").delete().eq("sale_id", s.id);
    if(s.items && s.items.length){
      await sb.from("shop_sale_items").insert(s.items.map(i=>({
        id: s.id+"-"+Math.random().toString(36).slice(2,8), sale_id:s.id, product_id:i.productId||null, name:i.name, unit:i.unit||"pcs", price:i.price, qty:i.qty
      })));
    }
  }
}

/* ---- Work sessions <-> shop_work_sessions ---- */
function dayRangeIso(dateKey){
  // local calendar day -> UTC instants, so near-midnight rows land on the right day
  return {
    from: new Date(dateKey + "T00:00:00").toISOString(),
    to: new Date(dateKey + "T23:59:59.999").toISOString()
  };
}
async function sbFetchWorkSessions(dateKey){
  const {from, to} = dayRangeIso(dateKey);
  const {data, error} = await sb.from("shop_work_sessions")
    .select("*").gte("start_time", from).lte("start_time", to).order("start_time");
  if(error){ console.error(error); showToast("Couldn't load sessions"); return []; }
  return data.map(r=>({id:r.id, start:r.start_time, end:r.end_time, durationMs:Number(r.duration_ms), note:r.note||""}));
}
async function sbSyncWorkSessions(arr){
  if(!arr.length) return;
  const {error} = await sb.from("shop_work_sessions").upsert(arr.map(s=>({
    id:s.id, start_time:s.start, end_time:s.end, duration_ms:s.durationMs, note:s.note||null
  })));
  if(error){ console.error(error); showToast("Couldn't save session"); }
}

/* ---- Daily routine <-> shop_routine_state (one row per checked item) ---- */
async function sbFetchRoutine(dateKey){
  const {data, error} = await sb.from("shop_routine_state").select("item_id, done").eq("date", dateKey);
  if(error){ console.error(error); showToast("Couldn't load routine"); return {}; }
  const out = {};
  (data||[]).forEach(r=>{ out[r.item_id] = r.done; });
  return out;
}
async function sbSyncRoutine(dateKey, obj){
  const upserts = [], deletes = [];
  Object.keys(obj || {}).forEach(itemId=>{
    if(obj[itemId]) upserts.push({id: dateKey + "-" + itemId, date: dateKey, item_id: itemId, done: true});
    else deletes.push(dateKey + "-" + itemId);
  });
  if(upserts.length){
    const {error} = await sb.from("shop_routine_state").upsert(upserts);
    if(error){ console.error(error); showToast("Couldn't save — try again"); }
  }
  for(const id of deletes){
    await sb.from("shop_routine_state").delete().eq("id", id);
  }
}

async function storeGet(key){
  if(key === "pos-products") return await sbFetchProducts();
  if(key === "purchases") return await sbFetchPurchases();
  if(key === "khata-customers") return await sbFetchSimple("shop_customers");
  if(key === "khata-suppliers") return await sbFetchSimple("shop_suppliers");
  if(key === "khata-tx") return await sbFetchKhataTx();
  if(key === "supplier-tx") return await sbFetchSupplierTx();
  if(key === "cashbook") return await sbFetchCashbook();
  if(key.startsWith("pos-sales:")) return await sbFetchSalesForDate(key.slice(10));
  if(key.startsWith("bill-photo:")){
    const {data, error} = await sb.from("shop_sales").select("photo_data_url").eq("id", key.slice(11)).maybeSingle();
    if(error || !data) return null;
    return data.photo_data_url || null;
  }
  if(key.startsWith("work-sessions:")) return await sbFetchWorkSessions(key.slice(14));
  if(key.startsWith("routine:")) return await sbFetchRoutine(key.slice(8));
  return await localGet(key);
}
async function storeSet(key, value){
  if(key === "pos-products") return await sbSyncProducts(value);
  if(key === "purchases") return await sbSyncPurchases(value);
  if(key === "khata-customers") return await sbSyncSimple("shop_customers", value);
  if(key === "khata-suppliers") return await sbSyncSimple("shop_suppliers", value);
  if(key === "khata-tx") return await sbSyncKhataTx(value);
  if(key === "supplier-tx") return await sbSyncSupplierTx(value);
  if(key === "cashbook") return await sbSyncCashbook(value);
  if(key.startsWith("pos-sales:")) return await sbSyncSalesForDate(value);
  if(key.startsWith("bill-photo:")){
    const {error} = await sb.from("shop_sales").update({photo_data_url:value, has_paper_photo:true}).eq("id", key.slice(11));
    if(error){ console.error(error); showToast("Couldn't save photo"); }
    return;
  }
  if(key.startsWith("work-sessions:")) return await sbSyncWorkSessions(value);
  if(key.startsWith("routine:")) return await sbSyncRoutine(key.slice(8), value);
  return await localSet(key, value);
}

document.getElementById("sheetLayer").addEventListener("click", (e)=>{
  const toggleBtn = e.target.closest(".calc-toggle");
  if(toggleBtn){
    const pad = document.getElementById(toggleBtn.dataset.calcFor + "_pad");
    if(pad) pad.classList.toggle("open");
    return;
  }
  const key = e.target.closest(".calc-key");
  if(key){
    const pad = key.closest(".calc-pad");
    const inputId = pad.id.slice(0, -4);
    const input = document.getElementById(inputId);
    if(!input) return;
    const k = key.dataset.k;
    if(k === "AC"){ input.value = ""; }
    else if(k === "back"){ input.value = input.value.slice(0, -1); }
    else if(k === "="){
      try{
        const expr = input.value.replace(/[^0-9+\-*/.() ]/g, "");
        if(expr.trim()){
          const result = Function('"use strict"; return (' + expr + ')')();
          if(isFinite(result)) input.value = (Math.round(result * 100) / 100).toString();
        }
      }catch(err){ /* ignore invalid expression */ }
    } else {
      input.value += k;
    }
  }
});

/* ---------- WORK TAB ---------- */
let running = null;
let sessions = [];
let tickHandle = null;

async function loadWork(){
  running = await storeGet("work-running");
  sessions = (await storeGet("work-sessions:"+todayKey())) || [];
  renderWork();
  if(running){ startTicking(); }
}
function renderWork(){
  document.getElementById("toggleBtn").textContent = running ? "Stop work" : "Start work";
  document.getElementById("toggleBtn").classList.toggle("running", !!running);
  document.getElementById("timerHint").textContent = running ? "Working since " + fmtTimeLabel(running.start) : "Not working right now";
  const totalMs = sessions.reduce((sum,s)=>sum+s.durationMs,0);
  document.getElementById("totalToday").textContent = fmtHM(totalMs);
  const list = document.getElementById("sessionsList");
  if(sessions.length === 0){
    list.innerHTML = '<div class="empty-note">No sessions yet today</div>';
  } else {
    list.innerHTML = sessions.slice().reverse().map(s => `
      <div class="session">
        <div>
          <div class="meta">${fmtTimeLabel(s.start)} – ${fmtTimeLabel(s.end)}</div>
          ${s.note ? `<div class="note">${escapeHtml(s.note)}</div>` : ""}
        </div>
        <div class="dur">${fmtHM(s.durationMs)}</div>
      </div>
    `).join("");
  }
}
function startTicking(){
  if(tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(()=>{
    if(!running) return;
    document.getElementById("elapsed").textContent = fmtClock(Date.now() - new Date(running.start).getTime());
  }, 1000);
}
function stopTicking(){ if(tickHandle) clearInterval(tickHandle); document.getElementById("elapsed").textContent = "00:00:00"; }
document.getElementById("toggleBtn").addEventListener("click", async ()=>{
  if(!running){
    running = { start: new Date().toISOString() };
    await storeSet("work-running", running);
    renderWork(); startTicking();
  } else { openNoteSheet(); }
});
function openNoteSheet(){
  const layer = document.getElementById("sheetLayer");
  layer.innerHTML = `
    <div class="sheet-backdrop"><div class="sheet">
      <h2>Nice work</h2>
      <p>You worked ${fmtHM(Date.now() - new Date(running.start).getTime())}. Add a quick note about what you did?</p>
      <textarea id="noteInput" placeholder="e.g. Client emails, invoice follow-ups..."></textarea>
      <div class="sheet-actions">
        <button class="btn-skip" id="skipNote">Skip</button>
        <button class="btn-save" id="saveNote">Save session</button>
      </div>
    </div></div>`;
  document.getElementById("skipNote").addEventListener("click", ()=>finishSession(""));
  document.getElementById("saveNote").addEventListener("click", ()=>finishSession(document.getElementById("noteInput").value.trim()));
}
async function finishSession(note){
  const end = new Date().toISOString();
  const durationMs = new Date(end).getTime() - new Date(running.start).getTime();
  sessions.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), start: running.start, end, durationMs, note });
  await storeSet("work-sessions:"+todayKey(), sessions);
  running = null;
  await storeSet("work-running", null);
  document.getElementById("sheetLayer").innerHTML = "";
  stopTicking(); renderWork();
  showToast("Session saved");
}

function to12h(t){
  const [h,m] = t.split(":").map(Number);
  const period = h>=12 ? "PM" : "AM";
  const hh = h%12 === 0 ? 12 : h%12;
  return hh+":"+String(m).padStart(2,"0")+" "+period;
}

function customerBalance(customerId){
  return khataTx.filter(t=>t.customerId===customerId).reduce((s,t)=> s + (t.type==="credit" ? t.amount : -t.amount), 0);
}
function supplierBalance(supplierId){
  return supplierTx.filter(t=>t.supplierId===supplierId).reduce((s,t)=> s + (t.type==="credit" ? t.amount : -t.amount), 0);
}
function cashInHand(){
  return cashbook.reduce((s,e)=> s + (e.type==="in" ? e.amount : -e.amount), 0);
}
function waLink(phone, text){
  const digits = (phone||"").replace(/[^0-9]/g, "");
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(text);
}
function avgCost(productId){
  const rel = purchases.filter(p=>p.productId===productId);
  if(rel.length===0) return null;
  const totalQty = rel.reduce((s,p)=>s+p.qty,0);
  const totalCost = rel.reduce((s,p)=>s+p.qty*p.price,0);
  return totalQty>0 ? totalCost/totalQty : null;
}

function addToCart(productId){
  const p = products.find(x=>x.id===productId);
  if(!p) return;
  const existing = cart.find(i=>i.productId===productId);
  const currentQty = existing?existing.qty:0;
  if(currentQty >= p.stock){ showToast("Out of stock"); return; }
  if(existing) existing.qty += 1;
  else cart.push({productId:p.id, name:p.name, price:p.salePrice, unit:p.unit||'pcs', qty:1});
  storeSet("pos-cart", cart);
}
function changeQty(productId, act){
  const item = cart.find(i=>i.productId===productId);
  if(!item) return;
  const prod = products.find(p=>p.id===productId);
  const step = unitStep(item.unit);
  if(act === "inc"){
    if(prod && item.qty + step > prod.stock + 0.0001){ showToast("Out of stock"); return; }
    item.qty = Math.round((item.qty + step) * 100) / 100;
  } else {
    item.qty = Math.round((item.qty - step) * 100) / 100;
  }
  if(item.qty <= 0) cart = cart.filter(i=>i.productId!==productId);
  storeSet("pos-cart", cart);
}
async function completeSale(payment){
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const paidCash = payment ? payment.paidCash : total;
  const creditAmount = payment ? payment.creditAmount : 0;
  const customerId = payment ? payment.customerId : null;
  const customer = customerId ? customers.find(c=>c.id===customerId) : null;
  const bill = {
    id: Date.now().toString(36), time: new Date().toISOString(),
    items: cart.map(i=>({...i})), total, hasPaperPhoto:false,
    paidCash, creditAmount, customerId, customerName: customer ? customer.name : null
  };
  cart.forEach(i=>{
    const prod = products.find(p=>p.id===i.productId);
    if(prod) prod.stock = Math.max(0, Math.round((prod.stock - i.qty)*100)/100);
  });
  await storeSet("pos-products", products);
  salesToday.push(bill);
  await storeSet("pos-sales:"+todayKey(), salesToday);
  cart = [];
  await storeSet("pos-cart", cart);

  if(paidCash > 0){
    cashbook.push({id: Date.now().toString(36)+"c", type:"in", amount: paidCash, note:"Sale", date: bill.time, partyType: customer?"customer":null, partyId: customer?customer.id:null, partyName: customer?customer.name:null});
    await storeSet("cashbook", cashbook);
  }
  if(creditAmount > 0 && customerId){
    khataTx.push({id: Date.now().toString(36)+"k", customerId, type:"credit", amount: creditAmount, note: "Bill "+bill.id, date: bill.time, billId: bill.id});
    await storeSet("khata-tx", khataTx);
  }

  renderPOS(); renderStock(); renderLedger();
  showToast("Sale recorded");
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 800;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
document.getElementById("photoInput").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if(!file || !currentPhotoBillId) return;
  try{
    const dataUrl = await compressImage(file);
    await storeSet("bill-photo:"+currentPhotoBillId, dataUrl);
    const bill = salesToday.find(b=>b.id===currentPhotoBillId);

/* --- Auto-generated receipt image --- */
function generateReceiptDataUrl(bill){
  const width = 380;
  const lineHeight = 22;
  const height = 150 + bill.items.length*lineHeight + 50;
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FBF9F4"; ctx.fillRect(0,0,width,height);
  ctx.fillStyle = "#1C2E20";
  ctx.font = "600 20px Georgia, serif";
  ctx.textAlign = "center";
  ctx.fillText("Receipt", width/2, 34);
  ctx.font = "13px Arial";
  ctx.fillStyle = "#5B6156";
  ctx.fillText(new Date(bill.time).toLocaleString(), width/2, 54);
  ctx.strokeStyle = "#DCD6C7";
  ctx.beginPath(); ctx.moveTo(20,68); ctx.lineTo(width-20,68); ctx.stroke();
  let y = 92;
  ctx.font = "14px Arial";
  bill.items.forEach(i=>{
    ctx.textAlign = "left"; ctx.fillStyle = "#22271F";
    ctx.fillText(`${formatQty(i.qty,i.unit)} × ${i.name}`, 20, y);
    ctx.textAlign = "right";
    ctx.fillText("Rs " + (i.price*i.qty).toFixed(0), width-20, y);
    y += lineHeight;
  });
  y += 6;
  ctx.beginPath(); ctx.moveTo(20,y); ctx.lineTo(width-20,y); ctx.stroke();
  y += 28;
  ctx.font = "600 17px Arial";
  ctx.textAlign = "left"; ctx.fillText("Total", 20, y);
  ctx.textAlign = "right"; ctx.fillText("Rs " + bill.total.toFixed(0), width-20, y);
  return canvas.toDataURL("image/png");
}
function openReceiptSheet(bill){
  const layer = document.getElementById("sheetLayer");
  const dataUrl = generateReceiptDataUrl(bill);
  layer.innerHTML = `<div class="sheet-backdrop"><div class="sheet">
    <h2>Receipt</h2>
    <img src="${dataUrl}" class="receipt-preview">
    <div class="sheet-actions">
      <button class="btn-skip" id="closeReceipt">Close</button>
      <button class="btn-save" id="downloadReceipt">${navigator.share ? 'Share' : 'Download'}</button>
    </div></div></div>`;
  document.getElementById("closeReceipt").addEventListener("click", ()=>layer.innerHTML="");
  document.getElementById("downloadReceipt").addEventListener("click", async ()=>{
    if(navigator.share){
      try{
        const blob = await (await fetch(dataUrl)).blob();
        const file = new File([blob], "receipt.png", {type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:"Receipt"});
          return;
        }
      }catch(e){}
    }
    const a = document.createElement("a");
    a.href = dataUrl; a.download = "receipt-"+bill.id+".png"; a.click();
  });
}

      <button class="btn-save" id="saveRestock">Add to stock</button>
    </div></div></div>`;
  const sel = document.getElementById("restockProduct");
  const newFields = document.getElementById("newProductFields");
  const unitSel = document.getElementById("newProdUnit");
  const unitCustom = document.getElementById("newProdUnitCustom");

  function updateHint(){
    const hint = document.getElementById("qtyUnitHint");
    if(sel.value === "__new__"){
      const u = unitSel.value === "custom" ? (unitCustom.value.trim() || "unit") : unitSel.value;
      hint.textContent = "(in " + (UNIT_LABELS[u] || u) + ")";
    } else {
      const prod = products.find(p=>p.id===sel.value);
      const u = prod ? (prod.unit || "pcs") : "pcs";
      hint.textContent = "(in " + (UNIT_LABELS[u] || u) + ")";
    }
  }
  sel.addEventListener("change", ()=>{
    newFields.style.display = sel.value === "__new__" ? "block" : "none";
    updateHint();
  });
  unitSel.addEventListener("change", ()=>{
    unitCustom.style.display = unitSel.value === "custom" ? "block" : "none";
    updateHint();
  });
  unitCustom.addEventListener("input", updateHint);
  newFields.style.display = sel.value === "__new__" ? "block" : "none";
  updateHint();

  let priceMode = "unit";
  const modeUnitBtn = document.getElementById("priceModeUnit");
  const modeTotalBtn = document.getElementById("priceModeTotal");
  const priceFieldLabel = document.getElementById("priceFieldLabel");
  const priceInput = document.getElementById("restockPrice");
  function setPriceMode(mode){
    priceMode = mode;
    modeUnitBtn.classList.toggle("active", mode === "unit");
    modeTotalBtn.classList.toggle("active", mode === "total");
    priceFieldLabel.textContent = mode === "unit" ? "Purchase price (per unit)" : "Total amount paid (for this batch)";
    priceInput.placeholder = mode === "unit" ? "e.g. 53" : "e.g. 5300";
  }
  modeUnitBtn.addEventListener("click", ()=>{ setPriceMode("unit"); updateBatchTotal(); });
  modeTotalBtn.addEventListener("click", ()=>{ setPriceMode("total"); updateBatchTotal(); });

  // --- Payment to supplier (Cash / Credit / Partial) ---
  let payMode = "cash";
  const rsCashBtn = document.getElementById("rsPayCash");
  const rsCreditBtn = document.getElementById("rsPayCredit");
  const rsPartialBtn = document.getElementById("rsPayPartial");
  const rsSupplierWrap = document.getElementById("rsSupplierWrap");
  const rsPartialWrap = document.getElementById("rsPartialWrap");
  const rsSupplierSel = document.getElementById("rsSupplier");
  wireNewCustomerFields(rsSupplierSel, "rsNewSupWrap");
  function setPayMode(mode){
    payMode = mode;
    [rsCashBtn, rsCreditBtn, rsPartialBtn].forEach(b=>b.classList.remove("active"));
    ({cash:rsCashBtn, credit:rsCreditBtn, partial:rsPartialBtn})[mode].classList.add("active");
    rsSupplierWrap.style.display = mode === "cash" ? "none" : "block";
    rsPartialWrap.style.display = mode === "partial" ? "block" : "none";
  }
  rsCashBtn.addEventListener("click", ()=>setPayMode("cash"));
  rsCreditBtn.addEventListener("click", ()=>setPayMode("credit"));
  rsPartialBtn.addEventListener("click", ()=>setPayMode("partial"));

  function currentBatchTotal(){
    const q = parseFloat(document.getElementById("restockQty").value);
    const ep = parseFloat(document.getElementById("restockPrice").value);
    if(isNaN(q) || q<=0 || isNaN(ep) || ep<0) return 0;
    const unitPrice = priceMode === "total" ? ep / q : ep;
    return Math.round(q * unitPrice * 100) / 100;
  }
  function updateBatchTotal(){
    document.getElementById("restockBatchTotal").textContent = "Rs " + currentBatchTotal().toFixed(0);
  }
  document.getElementById("restockQty").addEventListener("input", updateBatchTotal);
  document.getElementById("restockPrice").addEventListener("input", updateBatchTotal);
  const rpPad = document.getElementById("restockPrice_pad");
  if(rpPad) rpPad.addEventListener("click", ()=> setTimeout(updateBatchTotal, 0));
  updateBatchTotal();

  document.getElementById("cancelRestock").addEventListener("click", ()=> layer.innerHTML="");
  document.getElementById("saveRestock").addEventListener("click", async ()=>{
    const qty = parseFloat(document.getElementById("restockQty").value);
    const enteredPrice = parseFloat(document.getElementById("restockPrice").value);
    if(isNaN(qty) || qty<=0 || isNaN(enteredPrice) || enteredPrice<0){ showToast("Enter a valid quantity and price"); return; }
    const price = priceMode === "total" ? Math.round((enteredPrice / qty) * 100) / 100 : enteredPrice;
    const batchTotal = Math.round(qty * price * 100) / 100;

    // Resolve supplier when this isn't a straight cash purchase
    let supplierId = null, supplierName = null;
    if(payMode !== "cash"){
      supplierId = rsSupplierSel.value;
      if(supplierId === "__new__"){
        const sName = document.getElementById("rsNewSupName").value.trim();
        if(!sName){ showToast("Enter supplier name"); return; }
        const newSup = {id: Date.now().toString(36), name: sName, phone: document.getElementById("rsNewSupPhone").value.trim()};
        suppliers.push(newSup);
        await storeSet("khata-suppliers", suppliers);
        supplierId = newSup.id; supplierName = newSup.name;
      } else {
        const s = suppliers.find(x=>x.id===supplierId);
        if(!s){ showToast("Pick a supplier"); return; }
        supplierName = s.name;
      }
    }

    // Split batch total into cash-now vs credit
    let cashPaid = batchTotal, creditAmount = 0;
    if(payMode === "credit"){ cashPaid = 0; creditAmount = batchTotal; }
    else if(payMode === "partial"){
      const entered = parseFloat(document.getElementById("rsCashNow").value);
      cashPaid = isNaN(entered) ? 0 : Math.min(Math.max(entered, 0), batchTotal);
      creditAmount = Math.round((batchTotal - cashPaid) * 100) / 100;
    }

    let productId = sel.value;
    if(productId === "__new__"){
      const name = document.getElementById("newProdName").value.trim();
      const salePrice = parseFloat(document.getElementById("newProdSalePrice").value);
      const unit = unitSel.value === "custom" ? (unitCustom.value.trim() || "unit") : unitSel.value;
      if(!name || isNaN(salePrice)){ showToast("Enter product name and sale price"); return; }
      const newProd = {id: Date.now().toString(36), name, unit, salePrice, stock:0};
      products.push(newProd);
      productId = newProd.id;
    }
    const ref = document.getElementById("restockBillNo").value.trim();
    const nowIso = new Date().toISOString();
    purchases.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), productId, qty, price, date: nowIso, ref});
    const prod = products.find(p=>p.id===productId);
    prod.stock = Math.round((prod.stock + qty)*100)/100;
    await storeSet("pos-products", products);
    await storeSet("purchases", purchases);

    if(cashPaid > 0){
      cashbook.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:"out", amount: cashPaid, note: "Restock — " + prod.name + (ref ? " ("+ref+")" : ""), date: nowIso, partyType: supplierId ? "supplier" : null, partyId: supplierId, partyName: supplierName});
      await storeSet("cashbook", cashbook);
    }
    if(creditAmount > 0 && supplierId){
      supplierTx.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), supplierId, type:"credit", amount: creditAmount, note: formatQty(qty, prod.unit) + " " + prod.name, ref, date: nowIso});
      await storeSet("supplier-tx", supplierTx);
    }

    layer.innerHTML = "";
    showToast(creditAmount > 0 ? "Stock added · Rs " + creditAmount.toFixed(0) + " on credit" : "Stock updated");
    renderStock(); renderPOS(); renderLedger();
  });
}

function openImportSheet(kind){
  const layer = document.getElementById("sheetLayer");
  const label = kind === "customer" ? "customers" : "suppliers";
  layer.innerHTML = `<div class="sheet-backdrop"><div class="sheet">
    <h2>Import ${label}</h2>
    <p>One per line: <strong>Name, Phone (optional), Balance</strong>. Balance is what they currently owe. Example:<br>Subhan H/W, 03001234567, 808100<br>Mehboob H/W, , 399200</p>
    <textarea id="importText" style="min-height:160px;" placeholder="Name, Phone, Balance"></textarea>
    <div class="sheet-actions">
      <button class="btn-skip" id="cancelImport">Cancel</button>
      <button class="btn-save" id="saveImport">Import</button>
    </div>
  </div></div>`;
  document.getElementById("cancelImport").addEventListener("click", ()=> layer.innerHTML="");
  document.getElementById("saveImport").addEventListener("click", async ()=>{
    const text = document.getElementById("importText").value;
    const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
    if(lines.length===0){ showToast("Paste at least one line"); return; }
    let added = 0, updated = 0;
    const list = kind === "customer" ? customers : suppliers;
    const txArr = kind === "customer" ? khataTx : supplierTx;
    for(const line of lines){
      const parts = line.split(",").map(p=>p.trim());
      if(!parts[0]) continue;
      const name = parts[0];
      let phone = "", balance = 0;
      if(parts.length === 2){ balance = parseFloat(parts[1]) || 0; }
      else if(parts.length >= 3){ phone = parts[1]; balance = parseFloat(parts[2]) || 0; }
      let party = list.find(p => p.name.toLowerCase() === name.toLowerCase());
      if(!party){
        party = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), name, phone};
        list.push(party);
        added++;
      } else {
        updated++;
      }
      if(balance > 0){
        const entry = {id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), type:"credit", amount: balance, note:"Opening balance (imported)", date: new Date().toISOString()};
        if(kind === "customer") entry.customerId = party.id; else entry.supplierId = party.id;
        txArr.push(entry);
      }
    }
    if(kind === "customer"){
      await storeSet("khata-customers", customers);
      await storeSet("khata-tx", khataTx);
    } else {
      await storeSet("khata-suppliers", suppliers);
      await storeSet("supplier-tx", supplierTx);
    }
    layer.innerHTML = "";
    showToast(`Imported ${added} new${updated ? ", "+updated+" matched existing" : ""}`);
    renderLedger();
  });
}

    <h2>Record payment</h2>
    <p>You currently owe ${escapeHtml(sup.name)} Rs ${bal.toFixed(0)}.</p>
    <span class="form-label">Amount paid</span>
    ${calcFieldHtml("supPaymentAmount", "e.g. 5000")}
    <div class="sheet-actions">
      <button class="btn-skip" id="cancelSupPayment">Cancel</button>
      <button class="btn-save" id="saveSupPayment">Save</button>
    </div>
  </div></div>`;
  document.getElementById("cancelSupPayment").addEventListener("click", ()=>{ layer.innerHTML=""; openSupplierSheet(supplierId); });
  document.getElementById("saveSupPayment").addEventListener("click", async ()=>{
    const amount = parseFloat(document.getElementById("supPaymentAmount").value);
    if(isNaN(amount) || amount<=0){ showToast("Enter a valid amount"); return; }
    supplierTx.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), supplierId, type:"payment", amount, note:"", date: new Date().toISOString()});
    await storeSet("supplier-tx", supplierTx);
    cashbook.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:"out", amount, note:"Payment made", date: new Date().toISOString(), partyType:"supplier", partyId:supplierId, partyName:sup.name});
    await storeSet("cashbook", cashbook);
    layer.innerHTML = "";
    showToast("Payment recorded");
    renderLedger();
  });
}
function renderCashBody(){
  const body = document.getElementById("ledgerBody");
  const balance = cashInHand();
  const recent = cashbook.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,30);
  body.innerHTML = `
    <div class="card">
      <div class="today-total"><span class="label">Cash in hand</span><span class="value">Rs ${balance.toFixed(0)}</span></div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0;">Recent entries</div>
      <div id="cashList"></div>
    </div>`;
  const list = document.getElementById("cashList");
  if(recent.length===0){
    list.innerHTML = '<div class="empty-note">No entries yet — tap + to add one</div>';
  } else {
    list.innerHTML = recent.map(e=>`
      <div class="cash-row">
        <div>
          <div>${escapeHtml(e.note || (e.type==='in' ? 'Cash in' : 'Cash out'))}${e.partyName ? ` <span style="color:var(--ink-soft); font-weight:400;">— ${escapeHtml(e.partyName)}</span>` : ''}</div>
          <div class="cnote">${new Date(e.date).toLocaleDateString()} · ${fmtTimeLabel(e.date)}</div>
        </div>
        <div class="camt ${e.type}">${e.type==='in'?'+':'−'} Rs ${e.amount.toFixed(0)}</div>
      </div>`).join("");
  }
}
function customerSelectOptions(){
  return customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
}
function wireNewCustomerFields(sel, wrapId){
  sel.addEventListener("change", ()=>{
    document.getElementById(wrapId).style.display = sel.value === "__new__" ? "block" : "none";
  });
}
function openNewCreditSheet(){

  layer.innerHTML = `<div class="sheet-backdrop"><div class="sheet">

    <p>Record goods or money given on credit (not through a bill).</p>
    <span class="form-label">Customer</span>
    <select id="creditCustomer" class="select-field">
      <option value="__new__">+ New customer</option>
      ${customerSelectOptions()}
    </select>
    <div id="newCustomerFields" style="display:${customers.length===0?'block':'none'};">
      <span class="form-label">Name</span>
      <input type="text" id="newCustName" placeholder="Customer name">
      <span class="form-label">Phone (optional, for WhatsApp reminders)</span>
      <input type="text" id="newCustPhone" placeholder="e.g. 03001234567">
    </div>
    <span class="form-label">Amount</span>
    ${calcFieldHtml("creditAmount", "e.g. 1500")}

    <span class="form-label">Note (optional)</span>

    <div class="sheet-actions">

      <button class="btn-save" id="saveCredit">Save</button>
    </div>
  </div></div>`;
  const sel = document.getElementById("creditCustomer");

  document.getElementById("cancelCredit").addEventListener("click", ()=> layer.innerHTML="");
  document.getElementById("saveCredit").addEventListener("click", async ()=>{
    const amount = parseFloat(document.getElementById("creditAmount").value);
    if(isNaN(amount) || amount<=0){ showToast("Enter a valid amount"); return; }
    let customerId = sel.value;
    if(customerId === "__new__"){

      const newCust = {id: Date.now().toString(36), name, phone};
      customers.push(newCust);
      customerId = newCust.id;
      await storeSet("khata-customers", customers);

function openCustomerSheet(customerId){
  const layer = document.getElementById("sheetLayer");
  const cust = customers.find(c=>c.id===customerId);
  if(!cust) return;
  const bal = customerBalance(customerId);
  const history = khataTx.filter(t=>t.customerId===customerId).sort((a,b)=> new Date(b.date)-new Date(a.date));
  layer.innerHTML = `<div class="sheet-backdrop"><div class="sheet">
    <h2>${escapeHtml(cust.name)}</h2>
    <p>${bal>0 ? 'Owes Rs '+bal.toFixed(0) : 'Settled up'}${cust.phone ? ' · '+escapeHtml(cust.phone) : ''}</p>
    <div class="sheet-actions" style="margin-bottom:16px;">
      <button class="btn-save" id="recordPayment">Record payment</button>
      ${cust.phone ? `<a class="btn-whatsapp" id="waRemind" href="${waLink(cust.phone, bal>0 ? `Assalam-o-Alaikum ${cust.name}, aap ka humare taraf Rs ${bal.toFixed(0)} baqaya hai. Meharbani farma k jald ada karein. Shukriya.` : `Assalam-o-Alaikum ${cust.name}, shukriya!`)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
    </div>
    <div class="section-title" style="margin-top:0;">History</div>
    <div id="custHistory"></div>
    <div class="sheet-actions" style="margin-top:16px;"><button class="btn-skip" id="closeCust" style="flex:1;">Close</button></div>
  </div></div>`;
  const hist = document.getElementById("custHistory");
  hist.innerHTML = history.length===0 ? '<div class="empty-note">No entries yet</div>' : history.map(t=>`
    <div class="tx-row" data-tx="${t.id}" style="cursor:pointer;">
      <span>${t.type==='credit' ? 'Credit given' : 'Payment received'}${t.note ? ' — '+escapeHtml(t.note) : ''}${t.ref ? ' ('+escapeHtml(t.ref)+')' : ''}<span style="color:var(--ink-soft);"> ›</span></span>
      <span style="color:${t.type==='credit'?'var(--danger)':'var(--forest-deep)'}; font-weight:600;">${t.type==='credit'?'+':'−'} Rs ${t.amount.toFixed(0)}</span>
    </div>`).join("");
  hist.querySelectorAll(".tx-row[data-tx]").forEach(row=>{
    row.addEventListener("click", ()=> openTxDetailSheet("customer", row.dataset.tx, customerId));
  });
  document.getElementById("closeCust").addEventListener("click", ()=>{ layer.innerHTML=""; renderLedger(); });
  document.getElementById("recordPayment").addEventListener("click", ()=> openRecordPaymentSheet(customerId));
}
function openRecordPaymentSheet(customerId){
  const layer = document.getElementById("sheetLayer");
  const cust = customers.find(c=>c.id===customerId);
  const bal = customerBalance(customerId);
  layer.innerHTML = `<div class="sheet-backdrop"><div class="sheet">
    <h2>Record payment</h2>
    <p>${escapeHtml(cust.name)} currently owes Rs ${bal.toFixed(0)}.</p>
    <span class="form-label">Amount received</span>
    ${calcFieldHtml("paymentAmount", "e.g. 500")}
    <div class="sheet-actions">
      <button class="btn-skip" id="cancelPayment">Cancel</button>
      <button class="btn-save" id="savePayment">Save</button>
    </div>
  </div></div>`;
  document.getElementById("cancelPayment").addEventListener("click", ()=>{ layer.innerHTML=""; openCustomerSheet(customerId); });
  document.getElementById("savePayment").addEventListener("click", async ()=>{
    const amount = parseFloat(document.getElementById("paymentAmount").value);
    if(isNaN(amount) || amount<=0){ showToast("Enter a valid amount"); return; }
    khataTx.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), customerId, type:"payment", amount, note:"", date: new Date().toISOString()});
    await storeSet("khata-tx", khataTx);
    cashbook.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:"in", amount, note:"Payment received", date: new Date().toISOString(), partyType:"customer", partyId:customerId, partyName:cust.name});
    await storeSet("cashbook", cashbook);
    layer.innerHTML = "";
    showToast("Payment recorded");
    renderLedger();
  });
}
function txShareText(kind, tx, party, partyId){
  const isCust = kind === "customer";
  const isCredit = tx.type === "credit";
  const amt = "Rs " + tx.amount.toFixed(0);
  const dateStr = new Date(tx.date).toLocaleDateString();
  const bal = isCust ? customerBalance(partyId) : supplierBalance(partyId);
  const balLine = bal > 0
    ? (isCust ? `Ab baqaya: Rs ${bal.toFixed(0)}.` : `Ab hum par baqaya: Rs ${bal.toFixed(0)}.`)
    : "Hisaab clear hai.";
  const line = isCust
    ? (isCredit ? `Udhaar: ${amt}` : `Jama: ${amt}`)
    : (isCredit ? `Maal udhaar: ${amt}` : `Adaigi: ${amt}`);
  return `${party.name} — ${line}${tx.note ? ` (${tx.note})` : ""} — ${dateStr}. ${balLine}`;
}
function openTxDetailSheet(kind, txId, partyId){
  const layer = document.getElementById("sheetLayer");
  const isCust = kind === "customer";
  const txArr = isCust ? khataTx : supplierTx;
  const tx = txArr.find(t=>t.id===txId);
  if(!tx){ showToast("Entry not found"); return; }
  const party = (isCust ? customers : suppliers).find(p=>p.id===partyId);
  const isCredit = tx.type === "credit";
  const typeLabel = isCust
    ? (isCredit ? "Credit given" : "Payment received")
    : (isCredit ? "Bought on credit" : "Payment made");
  const d0 = new Date(tx.date);
  const dateVal = isNaN(d0) ? "" : d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+"-"+String(d0.getDate()).padStart(2,"0");
  const reopenParty = ()=> isCust ? openCustomerSheet(partyId) : openSupplierSheet(partyId);
  layer.innerHTML = `<div class="sheet-backdrop"><div class="sheet">
    <h2>Entry detail</h2>
    <p>${typeLabel}${tx.billId ? ' · from a bill' : ''} · ${new Date(tx.date).toLocaleString()}</p>
    <span class="form-label">Amount</span>
    ${calcFieldHtml("txEditAmount", "")}
    <span class="form-label">Note</span>
    <input type="text" id="txEditNote" placeholder="Note (optional)">
    <span class="form-label">Date</span>
    <input type="date" id="txEditDate">
    ${tx.billId ? `<p style="color:var(--ink-soft);">This entry came from a bill — changing it here won't change the original bill.</p>` : ''}
    <div class="sheet-actions">
      <button class="btn-skip" id="txDelete" style="background:var(--danger); color:#fff;">Delete</button>
      <button class="btn-save" id="txSave">Save changes</button>
    </div>
    ${party && party.phone ? `<a class="btn-whatsapp" style="margin-top:10px;" target="_blank" rel="noopener" href="${waLink(party.phone, txShareText(kind, tx, party, partyId))}">Share on WhatsApp</a>` : ''}
    <div class="sheet-actions" style="margin-top:10px;"><button class="btn-skip" id="txBack" style="flex:1;">Back</button></div>
  </div></div>`;
  document.getElementById("txEditAmount").value = tx.amount;
  document.getElementById("txEditNote").value = tx.note || "";
  if(dateVal) document.getElementById("txEditDate").value = dateVal;

  document.getElementById("txBack").addEventListener("click", ()=>{ layer.innerHTML=""; reopenParty(); });
  document.getElementById("txSave").addEventListener("click", async ()=>{
    const newAmount = parseFloat(document.getElementById("txEditAmount").value);
    if(isNaN(newAmount) || newAmount<=0){ showToast("Enter a valid amount"); return; }
    tx.amount = Math.round(newAmount*100)/100;
    tx.note = document.getElementById("txEditNote").value.trim();
    const d = document.getElementById("txEditDate").value;
    if(d) tx.date = new Date(d + "T12:00:00").toISOString();
    await storeSet(isCust ? "khata-tx" : "supplier-tx", txArr);
    layer.innerHTML = "";
    showToast("Entry updated");
    renderLedger();
    reopenParty();
  });
  let armed = false, armTimer = null;
  const delBtn = document.getElementById("txDelete");
  delBtn.addEventListener("click", async ()=>{
    if(!armed){
      armed = true;
      delBtn.textContent = "Tap again to delete";
      armTimer = setTimeout(()=>{ armed = false; delBtn.textContent = "Delete"; }, 3000);
      return;
    }
    if(armTimer) clearTimeout(armTimer);
    await sbDeleteRow(isCust ? "shop_khata_tx" : "shop_supplier_tx", tx.id);
    if(isCust) khataTx = khataTx.filter(t=>t.id!==tx.id);
    else supplierTx = supplierTx.filter(t=>t.id!==tx.id);
    layer.innerHTML = "";
    showToast("Entry deleted");
    renderLedger();
    reopenParty();
  });
}
function openCashEntrySheet(){
  const layer = document.getElementById("sheetLayer");
  layer.innerHTML = `<div class="sheet-backdrop"><div class="sheet">
    <h2>Add cash entry</h2>
    <div class="subtab-row">
      <button type="button" class="subtab-btn active" id="cashModeIn">Cash in</button>
      <button type="button" class="subtab-btn" id="cashModeOut">Cash out</button>
    </div>
    <span class="form-label">Amount</span>
    ${calcFieldHtml("cashAmount", "e.g. 2000")}
    <span class="form-label">Party (optional)</span>
    <select id="cashParty" class="select-field">
      <option value="">No party — general expense/income</option>
      ${customers.length ? `<optgroup label="Customers">${customers.map(c=>`<option value="c:${c.id}">${escapeHtml(c.name)}</option>`).join("")}</optgroup>` : ''}
      ${suppliers.length ? `<optgroup label="Suppliers">${suppliers.map(s=>`<option value="s:${s.id}">${escapeHtml(s.name)}</option>`).join("")}</optgroup>` : ''}
    </select>
    <span class="form-label">Note</span>
    <input type="text" id="cashNote" placeholder="e.g. Paid shop rent">
    <div class="sheet-actions">
      <button class="btn-skip" id="cancelCash">Cancel</button>
      <button class="btn-save" id="saveCash">Save</button>
    </div>
  </div></div>`;
  let cashType = "in";
  const inBtn = document.getElementById("cashModeIn");
  const outBtn = document.getElementById("cashModeOut");
  inBtn.addEventListener("click", ()=>{ cashType="in"; inBtn.classList.add("active"); outBtn.classList.remove("active"); });
  outBtn.addEventListener("click", ()=>{ cashType="out"; outBtn.classList.add("active"); inBtn.classList.remove("active"); });
  document.getElementById("cancelCash").addEventListener("click", ()=> layer.innerHTML="");
  document.getElementById("saveCash").addEventListener("click", async ()=>{
    const amount = parseFloat(document.getElementById("cashAmount").value);
    if(isNaN(amount) || amount<=0){ showToast("Enter a valid amount"); return; }
    const partyVal = document.getElementById("cashParty").value;
    let partyType = null, partyId = null, partyName = null;
    if(partyVal){
      const [kind, id] = partyVal.split(":");
      partyType = kind === "c" ? "customer" : "supplier";
      const list = kind === "c" ? customers : suppliers;
      const found = list.find(x=>x.id===id);
      if(found){ partyId = found.id; partyName = found.name; }
    }
    cashbook.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), type: cashType, amount, note: document.getElementById("cashNote").value.trim(), date: new Date().toISOString(), partyType, partyId, partyName});
    await storeSet("cashbook", cashbook);
    layer.innerHTML = "";
    showToast("Entry saved");
    renderLedger();
  });
}

/* ---------- Reminders (while page is open) ---------- */
let notifiedToday = {};
function checkReminders(){
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  ROUTINE.forEach(sec => sec.items.forEach(item=>{
    if(item.time === hm && !notifiedToday[item.id]){
      notifiedToday[item.id] = true;
      fireReminder(item.name);
    }
  }));
}
function fireReminder(name){
  showToast("Reminder: " + name);
  if(window.Notification && Notification.permission === "granted"){
    try{ new Notification("Time for: " + name); }catch(e){}
  }
}
setInterval(checkReminders, 20000);
document.getElementById("notifyBtn").addEventListener("click", async ()=>{
  if(window.Notification){
    const perm = await Notification.requestPermission();
    if(perm === "granted"){ document.getElementById("notifyBanner").style.display = "none"; showToast("Notifications on"); }
  }
});
if(window.Notification && Notification.permission === "default"){
  document.getElementById("notifyBanner").style.display = "block";
}

/* ---------- Tabs ---------- */
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("workTab").style.display = tab === "work" ? "block" : "none";
    document.getElementById("routineTab").style.display = tab === "routine" ? "block" : "none";
    document.getElementById("salesTab").style.display = tab === "sales" ? "block" : "none";
    document.getElementById("stockTab").style.display = tab === "stock" ? "block" : "none";
    document.getElementById("ledgerTab").style.display = tab === "ledger" ? "block" : "none";
    const titles = {work:"Work", routine:"Today's routine", sales:"Sales", stock:"Stock", ledger:"Ledger"};
    document.getElementById("pageTitle").textContent = titles[tab];
  });
});

async function startApp(){
  showApp();
  loadWork();
  loadRoutine();
  await loadInventory();
  await loadLedger();
  // seedDemoData() intentionally not called — demo data is kept dormant (see function below).
  renderPOS();
  renderStock();
  renderLedger();
}

(async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    await startApp();
  } else {
    showAuthScreen();
  }
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === "SIGNED_IN" && document.getElementById("app").style.display === "none"){
      startApp();
    }
    if(event === "SIGNED_OUT"){
      showAuthScreen();
    }
  });
})();
